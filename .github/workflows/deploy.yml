name: 🚀 Test & Deploy

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '*.md', 'loadtest/**', '.github/workflows/launch-day.yml']
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: true

env:
  SITE: https://workshop.incred.io
  AUTHOR: ${{ github.event.head_commit.author.name || github.actor }}
  MESSAGE: ${{ github.event.head_commit.message || 'manual deploy' }}

jobs:
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 📣 Tell the hall a commit arrived
        run: |
          short=${GITHUB_SHA::7}
          msg=$(printf '%s' "$MESSAGE" | head -n1)
          notify() { jq -nc --arg s "$1" --arg st "$2" --arg t "$3" '{stage:$s,status:$st,text:$t}' | curl -s -m 5 -X POST "$SITE/api/event" -H "Authorization: Bearer ${{ secrets.EVENT_TOKEN }}" -H 'Content-Type: application/json' -d @- >/dev/null || true; }
          notify push info "$short by $AUTHOR: \"$msg\""
          notify test info "for commit $short"

      - uses: actions/checkout@v4

      - name: 🧪 Run automated tests
        run: node --version && npm test

      - name: ❌ Report failure
        if: failure()
        run: |
          jq -nc --arg t "${GITHUB_SHA::7} by $AUTHOR — the live site was NOT touched" '{stage:"failed",status:"failure",text:$t}' \
            | curl -s -m 5 -X POST "$SITE/api/event" -H "Authorization: Bearer ${{ secrets.EVENT_TOKEN }}" -H 'Content-Type: application/json' -d @- || true

  deploy:
    name: 🚚 Deploy to AWS EC2
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: production
      url: https://workshop.incred.io
    steps:
      - uses: actions/checkout@v4

      - name: 📣 Tests passed, deploying
        run: |
          notify() { jq -nc --arg s "$1" --arg st "$2" --arg t "$3" '{stage:$s,status:$st,text:$t}' | curl -s -m 5 -X POST "$SITE/api/event" -H "Authorization: Bearer ${{ secrets.EVENT_TOKEN }}" -H 'Content-Type: application/json' -d @- >/dev/null || true; }
          notify tested success "for ${GITHUB_SHA::7}"
          notify deploy info "to EC2 in ap-south-1a"

      - name: 🏷️ Stamp version
        run: |
          jq -n --arg sha "$GITHUB_SHA" --arg short "${GITHUB_SHA::7}" --arg m "$(printf '%s' "$MESSAGE" | head -n1)" \
                --arg a "$AUTHOR" --arg t "$(date -u +%FT%TZ)" \
                '{sha:$sha,short:$short,message:$m,author:$a,time:$t}' > version.json
          cat version.json

      - name: 🔑 Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 ${{ vars.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: 📦 Ship code to the server
        run: |
          rsync -az --delete --exclude .git --exclude .github --exclude node_modules --exclude docs \
            ./ deploy@${{ vars.EC2_HOST }}:/opt/workshop/
          ssh deploy@${{ vars.EC2_HOST }} 'sudo systemctl restart workshop'

      - name: 🩺 Health check — is the new version really live?
        run: |
          for i in $(seq 1 30); do
            live=$(curl -s -m 3 "$SITE/api/health" | jq -r '.version.sha // empty' || true)
            if [ "$live" = "$GITHUB_SHA" ]; then echo "✅ $SITE is serving $GITHUB_SHA"; exit 0; fi
            sleep 1
          done
          echo "❌ New version did not come up"; exit 1

      - name: 🚀 Announce
        if: success()
        run: |
          jq -nc --arg t "${GITHUB_SHA::7} is live — thank you $AUTHOR!" '{stage:"live",status:"success",text:$t}' \
            | curl -s -m 5 -X POST "$SITE/api/event" -H "Authorization: Bearer ${{ secrets.EVENT_TOKEN }}" -H 'Content-Type: application/json' -d @- || true
